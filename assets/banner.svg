<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#03071e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1829" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseHeartbeat {
      0% { stroke-dashoffset: 800; opacity: 0.3; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -800; opacity: 0.3; }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-16px) translateX(12px); opacity: 0.8; }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(18px) translateX(-10px); opacity: 0.7; }
    }
    @keyframes radarPulse {
      0% { r: 10; opacity: 0.8; }
      100% { r: 50; opacity: 0; }
    }
    .ecg-line {
      stroke-dasharray: 800;
      animation: pulseHeartbeat 6s linear infinite;
    }
    .particle-1 { animation: floatParticle1 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 9s ease-in-out infinite; }
    .radar-circle { animation: radarPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGlow)"/>

  <!-- Subtle Circuit / Tech Grid -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Animated Glowing Background Orbs / Radar -->
  <g opacity="0.5">
    <circle cx="1060" cy="180" r="10" fill="none" stroke="#00f2fe" stroke-width="2" class="radar-circle"/>
    <circle cx="1060" cy="180" r="6" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="140" cy="80" r="45" fill="#7f00ff" filter="url(#glow)" opacity="0.25"/>
    <circle cx="950" cy="280" r="60" fill="#00f2fe" filter="url(#glow)" opacity="0.2"/>
  </g>

  <!-- Dynamic ECG / Heartbeat Wave in the lower background -->
  <path class="ecg-line" d="M 0,270 L 250,270 L 270,250 L 285,290 L 305,210 L 325,320 L 345,260 L 365,275 L 385,270 L 680,270 L 700,245 L 715,295 L 735,200 L 755,330 L 775,255 L 795,278 L 815,270 L 1200,270" 
        fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.6"/>

  <!-- Floating Dynamic Tech Particles -->
  <g class="particle-1">
    <circle cx="220" cy="90" r="3" fill="#00f2fe" />
    <circle cx="880" cy="70" r="4" fill="#4facfe" />
    <circle cx="1020" cy="130" r="3" fill="#7f00ff" />
  </g>
  <g class="particle-2">
    <circle cx="160" cy="220" r="3.5" fill="#4facfe" />
    <circle cx="780" cy="110" r="2.5" fill="#00f2fe" />
    <circle cx="1120" cy="240" r="4" fill="#00f2fe" />
  </g>

  <!-- Top Pill / Status Tag (Always In Clear Foreground) -->
  <g transform="translate(425, 34)">
    <rect width="350" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="22" cy="17" r="5" fill="#00f2fe" filter="url(#glow)"/>
    <text x="36" y="22" fill="#e0f7fa" font-size="12" font-weight="600" letter-spacing="1">CURATED AI HEALTHCARE ECOSYSTEM</text>
  </g>

  <!-- Foreground Title and Subtitles (High Contrast & Clear) -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Main Headline with Gradient Fill -->
    <text y="0" font-size="42" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome Healthcare Conversational AI
    </text>
    <!-- Subtitle 1 -->
    <text y="38" font-size="17" font-weight="500" fill="#ffffff" letter-spacing="0.3">
      Clinical Triage Bots • Medical Decision Support • Mental Health Agents • Open Frameworks
    </text>
    <!-- Subtitle 2 -->
    <text y="68" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.4">
      A vetted catalog of verified SaaS platforms &amp; open-source repositories for healthcare engineering
    </text>
  </g>

  <!-- Three Modern Foreground Info Badges -->
  <g transform="translate(180, 240)">
    <!-- Badge 1: Clinical Triage -->
    <g transform="translate(0, 0)">
      <rect width="240" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="32" font-size="18">🩺</text>
      <text x="56" y="25" fill="#f8fafc" font-size="13" font-weight="700">Clinical Triage</text>
      <text x="56" y="42" fill="#94a3b8" font-size="11">CE &amp; FDA Class II Triage</text>
    </g>

    <!-- Badge 2: Open Source Frameworks -->
    <g transform="translate(300, 0)">
      <rect width="240" height="52" rx="10" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="24" y="32" font-size="18">⚡</text>
      <text x="56" y="25" fill="#00f2fe" font-size="13" font-weight="700">Open-Source Agents</text>
      <text x="56" y="42" fill="#94a3b8" font-size="11">Rasa, MedCAT, OpenCHA &amp; LLMs</text>
    </g>

    <!-- Badge 3: HIPAA & Privacy -->
    <g transform="translate(600, 0)">
      <rect width="240" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="32" font-size="18">🛡️</text>
      <text x="56" y="25" fill="#f8fafc" font-size="13" font-weight="700">HIPAA &amp; EHR Ready</text>
      <text x="56" y="42" fill="#94a3b8" font-size="11">FHIR, SNOMED-CT &amp; Privacy</text>
    </g>
  </g>
</svg>
